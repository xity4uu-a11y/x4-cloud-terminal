policy_id: x4_demo_default
policy_version: "1.0.0"
description: "Fail-closed Demo & Paper risk policy for X4 Cloud Terminal."
allow_real: false
allowed_modes:
  - paper
  - demo
allowed_symbols:
  - XAUUSD
  - XAUUSDm
  - EURUSD
  - EURUSDm
  - GBPUSD
  - GBPUSDm
  - USDJPY
  - USDJPYm
risk:
  max_risk_per_trade_pct: 0.005
  daily_loss_limit_pct: 0.02
  max_overall_drawdown_pct: 0.08
  max_open_positions: 3
  max_lot_size: 0.50
  min_lot_size: 0.01
  max_spread_pips: 4.5
  max_quote_age_sec: 90.0
  min_stop_distance_pips: 5.0
  require_stop_loss: true
